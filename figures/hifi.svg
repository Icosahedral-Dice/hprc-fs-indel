<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img"><title>HiFi read support for dropped bases</title><desc>Most carriers have HiFi read support for the dropped insertion; most controls do not.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.t{font-size:16px;font-weight:600}.m{font-size:12px}.on{font-weight:600;font-size:12px}.grid,.axis{stroke-width:1}.stop{stroke-width:2}.bg,.surf{fill:#fcfcfb}text{fill:#0b0b0b}.sub{fill:#52514e}.m{fill:#898781}.s1{fill:#2a78d6}.s2{fill:#eb6834}.na{fill:#b9b8b0}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.stop{stroke:#0b0b0b}@media (prefers-color-scheme:dark){.bg,.surf{fill:#1a1a19}text{fill:#f0efec}.sub{fill:#c3c2b7}.m{fill:#898781}.s1{fill:#3987e5}.s2{fill:#d95926}.na{fill:#55544f}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.stop{stroke:#f0efec}}</style><rect width="760" height="220" class="bg"/><text x="24.0" y="30.0" class="t" text-anchor="start">HiFi reads confirm the dropped bases</text><text x="24.0" y="50.0" class="sub" text-anchor="start">Random frameshift-insertion events, one per gene: HPRC R2 HiFi reads at the GRCh38 position</text><rect x="200.0" y="70.0" width="12.0" height="12.0" rx="2" class="s1"/><text x="218.0" y="80.0" class="sub" text-anchor="start">insertion in ≥20% of reads</text><rect x="412.0" y="70.0" width="12.0" height="12.0" rx="2" class="na"/><text x="430.0" y="80.0" class="sub" text-anchor="start">5–20% / low coverage</text><rect x="582.0" y="70.0" width="12.0" height="12.0" rx="2" class="s2"/><text x="600.0" y="80.0" class="sub" text-anchor="start">insertion in ≤5% of reads</text><text x="24.0" y="117.0" class="" text-anchor="start">carriers (40)</text><text x="24.0" y="132.0" class="m" text-anchor="start">haplotype with the gap</text><rect x="200.0" y="105.0" width="479.0" height="22.0" rx="2" class="s1"/><text x="204.0" y="120.0" class="on" text-anchor="start">37</text><rect x="681.0" y="105.0" width="37.0" height="22.0" rx="2" class="s2"/><text x="685.0" y="120.0" class="on" text-anchor="start">3</text><text x="24.0" y="161.0" class="" text-anchor="start">controls (40)</text><text x="24.0" y="176.0" class="m" text-anchor="start">sample without it</text><rect x="200.0" y="149.0" width="11.0" height="22.0" rx="2" class="s1"/><text x="204.0" y="164.0" class="on" text-anchor="start">1</text><rect x="213.0" y="149.0" width="89.0" height="22.0" rx="2" class="na"/><text x="217.0" y="164.0" class="" text-anchor="start">7</text><rect x="304.0" y="149.0" width="414.0" height="22.0" rx="2" class="s2"/><text x="308.0" y="164.0" class="on" text-anchor="start">32</text><text x="24.0" y="204.0" class="m" text-anchor="start">Reads: HPRC R2 HiFi-to-GRCh38 alignments (the assemblies' own reads, so a consensus check).</text></svg>
