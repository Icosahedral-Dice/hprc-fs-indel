<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img"><title>Frameshift insertions and deletions hidden by CAT</title><desc>Of 55723 frame-changing CDS gap events, 49222 hide a frameshift insertion, 2443 a frameshift deletion and 4058 have an in-frame net change.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.t{font-size:16px;font-weight:600}.m{font-size:12px}.on{font-weight:600;font-size:12px}.grid,.axis{stroke-width:1}.stop{stroke-width:2}.bg,.surf{fill:#fcfcfb}text{fill:#0b0b0b}.sub{fill:#52514e}.m{fill:#898781}.s1{fill:#2a78d6}.s2{fill:#eb6834}.na{fill:#b9b8b0}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.stop{stroke:#0b0b0b}@media (prefers-color-scheme:dark){.bg,.surf{fill:#1a1a19}text{fill:#f0efec}.sub{fill:#c3c2b7}.m{fill:#898781}.s1{fill:#3987e5}.s2{fill:#d95926}.na{fill:#55544f}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.stop{stroke:#f0efec}}</style><rect width="760" height="256" class="bg"/><text x="24.0" y="30.0" class="t" text-anchor="start">The dropped bases hide frameshift insertions and frameshift deletions</text><text x="24.0" y="50.0" class="sub" text-anchor="start">Frame-changing CDS gap events by net CDS change of the repaired copy vs GRCh38</text><text x="24.0" y="93.0" class="" text-anchor="start">frameshift insertion</text><text x="24.0" y="108.0" class="m" text-anchor="start">CAT drops the inserted bases</text><rect x="280.0" y="81.0" width="230.0" height="22.0" rx="2" class="s1"/><text x="518.0" y="93.0" class="" text-anchor="start">49,222 events (88%)</text><text x="518.0" y="108.0" class="m" text-anchor="start">1,610 genes</text><text x="24.0" y="139.0" class="" text-anchor="start">frameshift deletion</text><text x="24.0" y="154.0" class="m" text-anchor="start">CAT drops bases beside a deletion</text><rect x="280.0" y="127.0" width="11.4" height="22.0" rx="2" class="s2"/><text x="299.4" y="139.0" class="" text-anchor="start">2,443 events (4%)</text><text x="299.4" y="154.0" class="m" text-anchor="start">233 genes</text><text x="24.0" y="185.0" class="" text-anchor="start">in-frame net change</text><text x="24.0" y="200.0" class="m" text-anchor="start">net change is a multiple of 3</text><rect x="280.0" y="173.0" width="19.0" height="22.0" rx="2" class="na"/><text x="307.0" y="185.0" class="" text-anchor="start">4,058 events (7%)</text><text x="307.0" y="200.0" class="m" text-anchor="start">225 genes</text><text x="24.0" y="224.0" class="m" text-anchor="start">Events = distinct haplotype × locus.</text><text x="24.0" y="240.0" class="m" text-anchor="start">CAT transcripts whose CDS reads intact but whose repaired CDS does not: 60,701 insertions, 1,365 deletions.</text></svg>
