<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img"><title>How CAT drops an insertion (SPRY2)</title><desc>CAT splits the SPRY2 CDS around a 1-bp gap that holds an inserted base; with the base restored the CDS has a premature stop at codon 132.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.t{font-size:16px;font-weight:600}.m{font-size:12px}.on{font-weight:600;font-size:12px}.grid,.axis{stroke-width:1}.stop{stroke-width:2}.bg,.surf{fill:#fcfcfb}text{fill:#0b0b0b}.sub{fill:#52514e}.m{fill:#898781}.s1{fill:#2a78d6}.s2{fill:#eb6834}.na{fill:#b9b8b0}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.stop{stroke:#0b0b0b}@media (prefers-color-scheme:dark){.bg,.surf{fill:#1a1a19}text{fill:#f0efec}.sub{fill:#c3c2b7}.m{fill:#898781}.s1{fill:#3987e5}.s2{fill:#d95926}.na{fill:#55544f}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.stop{stroke:#f0efec}}</style><rect width="760" height="308" class="bg"/><text x="24.0" y="30.0" class="t" text-anchor="start">How CAT drops an insertion: SPRY2 in HG02583 haplotype 2</text><text x="24.0" y="50.0" class="sub" text-anchor="start">Single-exon CDS, so the gap cannot be a projected intron. Coding strand 5′→3′; 1-bp gap drawn wider.</text><text x="24.0" y="96.0" class="" text-anchor="start">Assembly sequence</text><text x="24.0" y="112.0" class="m" text-anchor="start">949 bp incl. inserted G</text><rect x="190.0" y="83.0" width="430.0" height="18.0" rx="2" class="outline"/><rect x="318.4" y="78.0" width="10.0" height="28.0" rx="1" class="s2"/><text x="323.4" y="72.0" class="m" text-anchor="middle">inserted G</text><text x="24.0" y="158.0" class="" text-anchor="start">CAT CDS</text><text x="24.0" y="174.0" class="m" text-anchor="start">948 bp · proper_orf=True</text><text x="24.0" y="188.0" class="m" text-anchor="start">frameshift=False</text><rect x="190.0" y="145.0" width="129.4" height="18.0" rx="2" class="s1"/><rect x="327.4" y="145.0" width="292.6" height="18.0" rx="2" class="s1"/><text x="628.0" y="158.0" class="sub" text-anchor="start">reads as intact</text><text x="24.0" y="228.0" class="" text-anchor="start">Repaired CDS</text><text x="24.0" y="244.0" class="m" text-anchor="start">949 bp, gap bases put back</text><rect x="190.0" y="215.0" width="137.4" height="18.0" rx="2" class="s1"/><rect x="329.4" y="215.0" width="44.7" height="18.0" rx="2" class="s2"/><rect x="376.1" y="220.0" width="243.9" height="8.0" rx="2" class="na"/><line x1="374.1" y1="208" x2="374.1" y2="240" class="stop"/><text x="374.1" y="256.0" class="" text-anchor="middle">stop at codon 132 of 316</text><text x="346.7" y="208.0" class="m" text-anchor="middle">shifted frame</text><text x="628.0" y="228.0" class="sub" text-anchor="start">truncated</text><rect x="190.0" y="280.0" width="12.0" height="12.0" rx="2" class="s1"/><text x="208.0" y="290.0" class="sub" text-anchor="start">reference frame</text><rect x="325.0" y="280.0" width="12.0" height="12.0" rx="2" class="s2"/><text x="343.0" y="290.0" class="sub" text-anchor="start">inserted base / shifted frame</text><rect x="558.0" y="280.0" width="12.0" height="12.0" rx="2" class="na"/><text x="576.0" y="290.0" class="sub" text-anchor="start">not translated</text></svg>
