<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img"><title>CAT flags on transcripts with a dropped insertion</title><desc>Among 90379 CAT transcripts with a frame-changing CDS gap, proper_orf is True for most and frameshift is often False or N/A; 41962 pass both flags.</desc><style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px}.t{font-size:16px;font-weight:600}.m{font-size:12px}.on{font-weight:600;font-size:12px}.grid,.axis{stroke-width:1}.stop{stroke-width:2}.bg,.surf{fill:#fcfcfb}text{fill:#0b0b0b}.sub{fill:#52514e}.m{fill:#898781}.s1{fill:#2a78d6}.s2{fill:#eb6834}.na{fill:#b9b8b0}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.stop{stroke:#0b0b0b}@media (prefers-color-scheme:dark){.bg,.surf{fill:#1a1a19}text{fill:#f0efec}.sub{fill:#c3c2b7}.m{fill:#898781}.s1{fill:#3987e5}.s2{fill:#d95926}.na{fill:#55544f}.on{fill:#ffffff}.outline{fill:none;stroke:#898781;stroke-width:1.5}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.stop{stroke:#f0efec}}</style><rect width="760" height="308" class="bg"/><text x="24.0" y="30.0" class="t" text-anchor="start">CAT's flags pass 46% of transcripts with a dropped frame-changing insertion</text><text x="24.0" y="50.0" class="sub" text-anchor="start">90,379 CAT transcripts with a frame-changing 1–29 bp CDS gap, all 462 HPRC R2 haplotypes</text><rect x="200.0" y="70.0" width="12.0" height="12.0" rx="2" class="s2"/><text x="218.0" y="80.0" class="sub" text-anchor="start">looks fine</text><rect x="300.0" y="70.0" width="12.0" height="12.0" rx="2" class="s1"/><text x="318.0" y="80.0" class="sub" text-anchor="start">flags a problem</text><rect x="435.0" y="70.0" width="12.0" height="12.0" rx="2" class="na"/><text x="453.0" y="80.0" class="sub" text-anchor="start">no value (N/A)</text><text x="24.0" y="117.0" class="" text-anchor="start">proper_orf</text><rect x="200.0" y="101.0" width="393.5" height="22.0" rx="2" class="s2"/><text x="206.0" y="116.0" class="on" text-anchor="start">76%</text><rect x="595.5" y="101.0" width="122.5" height="22.0" rx="2" class="s1"/><text x="601.5" y="116.0" class="on" text-anchor="start">24%</text><rect x="720.0" y="101.0" width="0.0" height="22.0" rx="2" class="na"/><text x="24.0" y="157.0" class="" text-anchor="start">frameshift</text><rect x="200.0" y="141.0" width="176.7" height="22.0" rx="2" class="s2"/><text x="206.0" y="156.0" class="on" text-anchor="start">34%</text><rect x="378.7" y="141.0" width="192.7" height="22.0" rx="2" class="s1"/><text x="384.7" y="156.0" class="on" text-anchor="start">37%</text><rect x="573.4" y="141.0" width="144.6" height="22.0" rx="2" class="na"/><text x="579.4" y="156.0" class="" text-anchor="start">28%</text><text x="24.0" y="197.0" class="" text-anchor="start">CAT CDS as an ORF</text><rect x="200.0" y="181.0" width="355.1" height="22.0" rx="2" class="s2"/><text x="206.0" y="196.0" class="on" text-anchor="start">69%</text><rect x="557.1" y="181.0" width="160.9" height="22.0" rx="2" class="s1"/><text x="563.1" y="196.0" class="on" text-anchor="start">31%</text><line x1="24" y1="226" x2="720" y2="226" class="grid"/><text x="24.0" y="253.0" class="" text-anchor="start">repaired CDS as an ORF</text><rect x="200.0" y="237.0" width="41.2" height="22.0" rx="2" class="s2"/><text x="206.0" y="252.0" class="on" text-anchor="start">8%</text><rect x="243.2" y="237.0" width="474.8" height="22.0" rx="2" class="s1"/><text x="249.2" y="252.0" class="on" text-anchor="start">92%</text><text x="24.0" y="292.0" class="m" text-anchor="start">Flags: CAT's GFF3 tags. ORF rows: this repo's check (one start-to-stop frame, no internal stop).</text></svg>
